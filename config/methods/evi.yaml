# QDMO-EVI: Query-Driven Memory Organization with Evidence anchors
method: evi
name: evi
modality: multimodal

# Main online organization pipeline.
# faceted_topk = extract retrieval facets -> same anchor retriever per facet -> round-level merge -> top10 raw multimodal answer.
# consolidated_topk = retrieve anchors -> consolidate to candidate rounds -> take top10 directly -> semantic-style raw multimodal answer.
# episodic_state = legacy retrieve anchors -> ordered episodic memory sets -> cached state readout -> final answer.
# candidate_assertion = legacy retrieve anchors -> per-candidate assertions -> final answer.
evi_pipeline: faceted_topk

# Text embedding backend used for task-agnostic evidence-anchor retrieval.
# Safer default for local compile/smoke tests is all-MiniLM-L6-v2; use NV-Embed-v2 for full experiments if available.
# text_embedding_model: all-MiniLM-L6-v2
text_embedding_model: nvidia/NV-Embed-v2
# text_embedding_kwargs:
#   max_length: 16384
#   batch_size: 8

# VLM budget for offline anchor extraction, episodic state readout, legacy memory briefs, and final answering.
vlm_max_new_tokens: 1024
vlm_timeout: 90

# Broad retrieval over task-agnostic evidence anchors before online memory organization.
raw_search_k: 120

# Faceted retrieval pipeline budget. Each facet returns this many unique rounds after collapsing multiple evidence anchors from the same round.
facet_max_facets: 4
facet_search_k: 30
facet_multi_hit_bonus: 0.08
facet_full_question_weight: 1.0
use_facet_cache: true

# Retrieval-only ablation: anchor + facet retrieval -> ranked top-10 raw multimodal
# rounds -> the same QA history format as semantic_rag_multimodal. It does not call
# scope interpretation or the evidence organizer.
evi_retrieval_only: true

# Session-level evidence organization after faceted retrieval.
# First derive a question-only information-scope brief. It is independent of memory
# contents and is reused by every session organizer call to avoid inconsistent scope
# interpretation across candidate sessions. Set apply=false for a scope-log-only ablation.
evi_use_scope_interpretation: true
evi_apply_scope_to_organizer: true
use_scope_cache: true

# The organizer sees candidate rounds with images, weakly drops clearly irrelevant rounds,
# and injects short evidence notes into semantic-RAG-style raw history.
evi_use_evidence_organizer: true
evi_final_include_evidence_images: true
evi_final_max_rounds: 10
evi_organizer_max_rounds_per_session: 0

# Episodic-state pipeline budget.
# Retrieved anchors are grouped by session and round order into local memory sets.
# Keep this moderately high on route-like data because similar sessions can otherwise crowd out the correct episode.
max_memory_sets: 8
memory_set_window_before: 1
memory_set_window_after: 1
max_rounds_per_memory_set: 5
max_state_anchors_per_round: 6
max_final_states: 4
max_selected_rounds: 10
min_selected_rounds: 1
round_selector_max_new_tokens: 1024
use_round_selection_cache: true

# State readout cache and image use.
# State cache keys include prompt version, model namespace, question stem, memory-set content, and state images.
use_state_cache: true
use_state_images: true
max_state_images_per_set: 4

# Legacy candidate-centric memory briefing budget. Used only when evi_pipeline: candidate_assertion.
max_candidates: 20
max_candidate_anchors: 8
max_final_briefs: 10
max_excluded_briefs: 3

# Images included in the final VLM answer call.
# false = final answer is text-only over selected states/assertions; true = attach selected memory images for visual re-check ablations.
use_final_memory_images: false
max_answer_images: 12

# Important for fair multimodal experiments:
# false = do not index MemEye-provided image_caption fields; rely on image-derived anchors.
# true  = include dataset captions as an ablation / upper-information variant.
use_dataset_captions: false

# Cache text embeddings for dialogue anchors, visual anchors, and questions.
use_embedding_cache: true

# Cache candidate memory briefs generated by the legacy candidate_assertion pipeline.
use_memory_brief_cache: true

# EVI debug trace. The file records indexing, retrieval, memory-set construction,
# state readout, clue coverage, final prompt preview, selected images, and model answer.
evi_debug: true
evi_debug_console: true
# evi_debug_log_path: null  # Default: <run_dir>/evi_debug.log
evi_debug_append: true
evi_debug_top_k: 50
evi_debug_prompt_chars: 12000
